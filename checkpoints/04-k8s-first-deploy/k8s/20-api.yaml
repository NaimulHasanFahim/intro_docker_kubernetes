apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nsu-demo
spec:
  replicas: 1                # we will crank this up live in Checkpoint 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nsu-guestbook:v1
          imagePullPolicy: IfNotPresent   # IMPORTANT: use the image we loaded into
                                          # kind, do not try to pull from Docker Hub
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: v1
            - name: CHECKPOINT   # overrides the value baked into the image
              value: "4"
            - name: DB_HOST
              value: postgres    # the Service name from 10-postgres.yaml
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: nsu
            - name: DB_PASSWORD
              value: nsu_password
            - name: DB_NAME
              value: nsu_demo
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nsu-demo
spec:
  type: NodePort             # opens a port on every node so we can reach it from outside
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080        # matches extraPortMappings in kind-config.yaml -> localhost:8080
