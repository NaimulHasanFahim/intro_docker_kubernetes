apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nsu-demo
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1              # may add 1 extra pod during the rollout
      maxUnavailable: 0        # never drop below the desired count -> zero downtime
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nsu-guestbook:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: v1
            - name: CHECKPOINT   # overrides the value baked into the image
              value: "5"
          envFrom:             # pull in every key from these two objects at once
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          # "Are you alive?" If this fails, Kubernetes restarts the container.
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # "Are you ready for traffic?" If this fails, the Service stops
          # sending requests here -- but does NOT restart it. This is the probe
          # that makes zero-downtime deploys actually work.
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:          # what the scheduler reserves for you
              cpu: 50m
              memory: 64Mi
            limits:            # the hard ceiling; exceed memory and you get OOMKilled
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nsu-demo
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
